<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingthon & Thayna</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #762b9c 0%, #51156f 48%, #310b4b 100%);
      color: #fff0ff;
    }

    .capa {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* Corações espalhados pelo fundo */
    .coracoes {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .coracao {
      position: absolute;
      color: #e7b5ff;
      opacity: 0.20;
      user-select: none;
      animation: flutuar 6s ease-in-out infinite alternate;
    }

    @keyframes flutuar {
      from { transform: translateY(0) rotate(-8deg); }
      to { transform: translateY(-12px) rotate(8deg); }
    }

    .conteudo {
      text-align: center;
      padding: 30px 20px;
      z-index: 1;
      animation: aparecer 1.8s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: normal;
      letter-spacing: 2px;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(255, 210, 255, 0.15);
    }

    .coracao-central {
      color: #ffbde9;
      font-size: clamp(2.8rem, 7vw, 4rem);
      margin: 12px 0;
      animation: pulsar 2s infinite ease-in-out;
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.13); }
    }

    .frase {
      margin-top: 28px;
      font-size: clamp(0.95rem, 3vw, 1.25rem);
      letter-spacing: 1px;
      color: #f0d8fa;
      font-style: italic;
    }
  </style>
</head>

<body>
  <main class="capa">

    <div class="coracoes" aria-hidden="true">
      <span class="coracao" style="top:5%;left:8%;font-size:35px;">♡</span>
      <span class="coracao" style="top:12%;left:35%;font-size:24px;">♥</span>
      <span class="coracao" style="top:7%;right:12%;font-size:48px;">♡</span>
      <span class="coracao" style="top:25%;left:18%;font-size:52px;">♥</span>
      <span class="coracao" style="top:30%;right:8%;font-size:30px;">♡</span>
      <span class="coracao" style="top:42%;left:5%;font-size:28px;">♥</span>
      <span class="coracao" style="top:48%;right:20%;font-size:55px;">♥</span>
      <span class="coracao" style="top:60%;left:14%;font-size:40px;">♡</span>
      <span class="coracao" style="top:68%;right:7%;font-size:38px;">♡</span>
      <span class="coracao" style="top:80%;left:30%;font-size:32px;">♥</span>
      <span class="coracao" style="top:88%;right:25%;font-size:48px;">♡</span>
      <span class="coracao" style="top:92%;left:8%;font-size:25px;">♥</span>
      <span class="coracao" style="top:18%;left:75%;font-size:25px;">♥</span>
      <span class="coracao" style="top:75%;left:85%;font-size:28px;">♥</span>
      <span class="coracao" style="top:52%;left:45%;font-size:20px;">♡</span>
      <span class="coracao" style="top:3%;left:55%;font-size:30px;">♡</span>
      <span class="coracao" style="top:35%;left:90%;font-size:45px;">♥</span>
      <span class="coracao" style="top:95%;left:60%;font-size:35px;">♡</span>
    </div>

    <section class="conteudo">
      <h1>Wellingthon</h1>

      <div class="coracao-central">♥</div>

      <h1>Thayna</h1>

      <p class="frase">
        O pedaço favorito do meu coração.
      </p>
    </section>

  </main>
</body>
</html>
